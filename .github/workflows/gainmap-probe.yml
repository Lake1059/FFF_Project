# =============================================================================
# MANUAL-ONLY BUILD PROBE — NOT A PULL REQUEST GATE
# =============================================================================
#
# Trigger: workflow_dispatch ONLY. There is intentionally NO push / pull_request /
# merge_group trigger. This workflow:
#   * does NOT run on every push or PR,
#   * does NOT block merges, and must NOT be treated as CI certification.
#
# Why it is manual-only:
#   * FFF.Native links prebuilt ffmpeg (avcodec-63 / avformat-63 / avutil-61 /
#     swscale-10 / swresample-7) plus libraw / ass from third_party/, which are
#     NOT vendored in this repo. A bare GitHub-hosted runner cannot link.
#   * It therefore MUST run on a SELF-HOSTED runner that already has:
#       - Visual Studio 2022 (v145 toolset) + Windows 10/11 SDK,
#       - third_party/ffmpeg (and third_party/libraw) restored/cached,
#       - the repo checked out with those siblings present.
#     See docs/gainmap-testing.md and FFF.Native/tools/Resolve-NativeDependencies.ps1.
#
# Failure policy: any non-zero step (build OR probe smoke) FAILS the job. There is
# deliberately NO `::notice` that swallows a missing probe / non-zero exit. If the
# probe binary is not produced or `gainmap_probe.exe --help` exits non-zero, the
# job is red — that is the point of running it.
#
# The 38+41-file GainMap corpus lives OUTSIDE the repo (licensing/size; see
# docs/gainmap-testing.md) and is NOT downloaded here. Corpus matching is a local,
# manual step: run tools/run_corpus.ps1 on a machine that has the corpus, and treat
# docs/corpus_matrix.json as the per-run record.
# =============================================================================

name: gainmap-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build FFF.Native (Release|x64) + probe smoke
    # Self-hosted by design: a hosted runner cannot link the unvendored ffmpeg deps.
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build FFF.Native (Release|x64)
        id: build
        run: |
          msbuild FFF.Native\FFF.Native.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:minimal `
            /nologo
          if ($LASTEXITCODE -ne 0) { throw "msbuild FFF.Native failed (exit $LASTEXITCODE)" }

      - name: Probe smoke (gainmap_probe.exe --help must exist and exit 0)
        shell: pwsh
        run: |
          $probe = Get-ChildItem -Recurse -Filter 'gainmap_probe.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $probe) {
            throw "gainmap_probe.exe was not produced. On this self-hosted runner third_party/ffmpeg " +
                  "must be restored (see FFF.Native/tools/Resolve-NativeDependencies.ps1 and " +
                  "docs/gainmap-testing.md). This is a hard failure, not a notice."
          }
          Write-Host "Found probe: $($probe.FullName)"
          & $probe.FullName --help
          if ($LASTEXITCODE -ne 0) {
            throw "gainmap_probe.exe --help exited $LASTEXITCODE (expected 0)."
          }
          Write-Host "probe --help exit code: $LASTEXITCODE"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gainmap-probe-logs
          path: |
            FFF.Native\tools\build_out\*.log
            FFF.Native\tools\build_out_jpeg\*.log
            FFF.Native\*.log
          if-no-files-found: warn
          retention-days: 14
